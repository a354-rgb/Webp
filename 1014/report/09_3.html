<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book 객체 만들기</title>

</head>

<body>
    <h3>book 객체 만들기</h3>
    <hr>
    <script>
        function book(title, author, price) {
            this.title = "HTML5",
            this.author = "황기태",
            this.price = 20000
        };
        
        let b = new book();

        document.write("book : " + b.title +
            ", " + b.author +
            ", " + b.price);
    </script>
</body>

</html>
