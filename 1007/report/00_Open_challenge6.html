<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별 문자 출력하기</title>
    
    <script>
        function printStar(str){
            let n = parseInt(str);

            if (isNaN(n) || n <= 0 || n + "" != str)
                document.write("입력 오류 입니다.");
            else {
                for (let i = 0; i <= n; i++){
                    for (let j = 0; j < i; j++)
                        document.write("*");
                    document.write("<br>");
                }
            }  
        }
    </script>
</head>

<body>
    <h3>별 문자 출력하기</h3>
    <hr>
    <script>
        let str = prompt("정수를 입력하세요", "");
        printStar(str);
    </script>
</body>

</html>
