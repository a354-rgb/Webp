<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>큰 자리수와 낮은자리수 같은지 비교</h3>
    <hr>
    <script>
        let str = parseInt(prompt("숫자 입력", "")), n = str,  most = 0, least = n %10;
        while (n != 0){
            most = n%10
            n = Math.floor(n/10);
        }
        if (most == least)
            document.write(str + "는 같음");
        else
            document.write(str + "는 다름");
    </script>
</body>

</html>
