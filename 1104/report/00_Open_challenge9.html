    <style>
        table {

            border-collapse: collapse;

        td {
            border: 1px solid blue;
            width: 50px;
            height: 50px;
            padding: 0px;
        }

        img {
            width: 45px;
            height: 45px;
        }

        img[src=""] {display: none;}
    </style>

    <script>
        let i = Math.floor(Math.random() * 100);

        function start() {
            document.images[i].src = "donkey.png";
            for (let j = 0; j < document.images.length; j++) {
                document.images[j].addEventListener("click", click);
            }
        }

        function click() {
            if (this == document.images[i]) {
                document.images[i].src = "";
                i = Math.floor(Math.random() * 100);
                document.images[i].src = "donkey.png";
            }
        }


    </script>
</head>
