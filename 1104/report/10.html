<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기 만들기</title>

    <style>
        table {
            text-align: center;
        }

        td {
            width: 100px;
        }

        button {
            width: 60%;
        }
    </style>

</head>

<body>
    <h3>계산기 만들기</h3>
    <hr>
    <input type="text" id="win" value="0" style="width:99%">
    <table style="width:100%; height:100%;">
        <tr>
            <td><button onclick="Backspace()">BACK</button></td>
            <td><button onclick="evalclear()">CE</button></td>
            <td><button onclick="evalclear()">C</button></td>
            <td><button onclick="compute()">=</button></td>
        </tr>
        <tr>
            <td><button onclick="number(7)">7</button></td>
            <td><button onclick="number(8)">8</button></td>
            <td><button onclick="number(9)">9</button></td>
            <td><button onclick="number('/')">/</button></td>
        </tr>
        <tr>
            <td><button onclick="number(4)">4</button></td>
            <td><button onclick="number(5)">5</button></td>
            <td><button onclick="number(6)">6</button></td>
            <td><button onclick="number('*')">*</button></td>
        </tr>
        <tr>
            <td><button onclick="number(1)">1</button></td>
            <td><button onclick="number(2)">2</button></td>
            <td><button onclick="number(3)">3</button></td>
            <td><button onclick="number('-')">-</button></td>
        </tr>
        <tr>
            <td><button onclick="number(0)">0</button></td>
            <td><button onclick="number('+')">+</button></td>
            <td><button>NONE</button></td>
            <td><button>NONE</button></td>
        </tr>
    </table>

     <script>
        let win = document.getElementById("win");
        let text = "";

        function number(num) {
            text += num;
            win.value = text;
        }

        function Backspace() {
            text = text.substring(0, text.length - 1);
            win.value =  text;
        }

        function evalclear() {
            text = "";
            win.value = "0";
        }

        function compute() {
            text = eval(text).toString();
            win.value = text;
        }
    </script>
</body>

</html>
