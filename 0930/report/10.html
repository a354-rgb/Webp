<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<title>애니메이션 응용</title>

<style>
    @keyframes slide {
        0% {
                margin-left: 100%;
            }
            100% {
                margin-right: 0%;
            }
    }

    p {
        animation-name: slide;
        animation-duration: 3s;
        animation-iteration-count: 1;
    }
</style>

<body>
    <h3>애니메이션 응용</h3>
    <hr>
    <p>
        <img src="question.png" alt="물음표" width="20px" height="20px">
        질문 있습니다.
    </p>
</body>

</html>
