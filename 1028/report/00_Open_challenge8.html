<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갬블링 게임</title>

    <style>
        table {
            border: 1px solid violet;
            border-collapse: collapse;
        }

        td {
            width: 50px;
            height: 50px;
            padding: 0px;
            font: italic 50px consolas, sans-serif;
            color: blue;
            text-align: center;
            background: linen;
        }

        div#msg {
            font: italic 18px consolas, sans-serif;
            color: magenta;
            margin-top: 10px;
        }
    </style>

    <script>
        let Array = [0, 0, 0];
        let gameon = true;
        let clicked = [false, false, false];

        function gen(obj) {
            if (!gameon)
                return;

            let n = Math.floor(Math.random() * 3);
            let result;

            if (obj.id == 'first' && !clicked[0]) {
                obj.innerHTML = n;
                Array[0] = n;
                clicked[0] = true;
            }
            else if (obj.id == 'second' && !clicked[1]) {
                obj.innerHTML = n;
                Array[1] = n;
                clicked[1] = true;
            }
            else if (obj.id == 'third' && !clicked[2]) {
                obj.innerHTML = n;
                Array[2] = n;
                clicked[2] = true;
            }

            if (clicked[0] && clicked[1] && clicked[2]) {
                gameon = false;
                result = document.getElementById("msg");
                if (Array[0] == Array[1] && Array[1] == Array[2])
                    result.innerHTML = "Success(click here to do again)";
                else 
                    result.innerHTML = "fail(click here to do again)";
            }    
        }

        function restart() {
            Array = [0, 0, 0];
            clicked = [false, false, false];
            gameon = true;
            let tdArray = document.getElementsByTagName("td");
            for (let i = 0; i < tdArray.length; i++) {
                tdArray[i].innerHTML = 0;
            }
            document.getElementById("msg").innerHTML = "";
        }
    </script>
</head>

<body>
    <h3>갬블링 게임</h3>
    <p>각 숫자를 클릭하면 0에서 2 사이의 난수로 바뀝니다. 모두 같은 수가 나오면 승리합니다.</p>
    <hr>
    <table>
        <tr>
            <td id="first" onclick="gen(this)">0</td>
            <td id="second" onclick="gen(this)">0</td>
            <td id="third" onclick="gen(this)">0</td>
        </tr>
    </table>
    <div id="msg" onclick="restart()"></div>
</body>

</html>
