<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index 프로퍼티</title>

    <style>
        div {position: absolute;}
        img {position: absolute;}
    </style>
</head>

<body>
    <h3>z-index 스타일 프로퍼티</h3>
    <hr>
    <div>
        <img id="spadeA" src="media/spade-A.png" width="100" height="140" alt="스페이드A">
        <img id="spade2" src="media/spade-2.png" width="100" height="140" alt="스페이드2">
        <img id="spade3" src="media/spade-3.png" width="100" height="140" alt="스페이드3">
        <img id="spade7" src="media/spade-7.png" width="100" height="140" alt="스페이드7">
    </div>
    <script>
        let imgArray = document.getElementsByTagName("img");
        for (let i = 0; i < imgArray.length; i++){
            imgArray[i].style.zIndex = i;
            imgArray[i].style.left = '10px';
            imgArray[i].style.top = '20px';
            imgArray[i].onclick = change;
        }
        function change(){
            for (let i = 0; i < imgArray.length; i++){
                imgArray[i].style.zIndex++;
                imgArray[i].style.zIndex %= imgArray.length;
            }
        }
    </script>
</body>

</html>
