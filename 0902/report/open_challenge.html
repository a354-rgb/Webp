<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 소개</title>
    <style>
        body {background-color: linen; color: green;
              margin-left: 40px; margin-right: 40px;}
        h3 {text-align: center; color: darkred;}
        hr {height: 5px; border: solid gray;
            background-color: grey;}
        span{color: blue; font-size: 20px;} 
    </style>
    <script>
        function show(){ //<img>에 이미지 달기
            document.getElementById("fig").src="minhyuk.png";
        }
        function hide(){ //<img>에 이미지 제거
            document.getElementById("fig").src="";
        }
    </script>
</head>
<body>
    <h3 onmouseover="show()" onmouseout="hide()">
        이민혁</h3>
    <hr>
    <div><img id="fig" src=""></div>
    저는 대한민국에서 태어나 <span>소프트웨어</span>를 전공하는 학생입니다.
    이번 학기에 <span>웹프로그래밍</span> 강의를 수강중이며 현재 과제를 진행 중 입니다.
</body>
</html>
