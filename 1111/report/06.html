<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeout()/clearTimeout()</title>

    <style>
        div {
            display: inline-block;
            width: 7em;
            border: 1px solid gray;
            background-color: aliceblue;

        }
    </style>

    <script>
        let timerID = null;
        
        function pause() {
            if(timerID == null){
                timerID = setInterval("timeout(clock)", 1000);
                document.getElementById("clock").style.color = "black";
            }
            else {
                clearInterval(timerID);
                timerID = null;
                document.getElementById("clock").style.color = "gray";
            }
        }

        function startClock() {
            let clock = document.getElementById("clock");
            timeout(clock);
            timerID = setInterval("timeout(clock)", 1000);
        }

        function timeout(obj) {
            let current = new Date();
            obj.innerHTML = current.toLocaleTimeString()
        }
    </script>
</head>

<body onload="startClock()">
    <h3>div 태그에 시계 만들기</h3>
    시계를 클릭하면 시계가 멈추고 다시 클릭하면 가기 시작한다.
    <hr>
    <div id="clock" onclick="pause()"></div>
</body>

</html>
